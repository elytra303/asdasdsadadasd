name: build-cubecode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --verbose
        timeout-minutes: 30

      - name: Build CubeCode A1
        working-directory: packages/opencode
        run: bun run script/build.ts --single

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "packages/opencode/dist/opencode-windows-x64/bin/opencode.exe" "artifact/CubeCode-A1-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubecode-a1-windows-x64
          path: artifact/CubeCode-A1-windows-x64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CubeCode A1 build ${{ github.run_number }}
          files: artifact/CubeCode-A1-windows-x64.exe